name: capture
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'ignore cadence gate'
        type: boolean
        default: false
      selftest:
        description: 'run the orchestrator publish selftest instead of capturing'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: orchestrator selftest
        if: ${{ inputs.selftest }}
        run: python scripts/orchestrate.py --selftest

      - name: capture cycle
        if: ${{ !inputs.selftest }}
        env:
          NOCTURNE_SOURCE: gh
        run: |
          python scripts/capture.py ${{ inputs.force && '--force' || '' }}
          python scripts/build_state.py || echo "state build skipped"
          python scripts/shoot.py || echo "shot skipped"
          python scripts/orchestrate.py || echo "orchestrator skipped"
      - name: commit
        if: ${{ !inputs.selftest }}
        run: |
          git config user.name "nocturne-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/ api/ predictions/ posts/ shots/ 2>/dev/null || git add -A data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "capture $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin master && git push && exit 0
            echo "retry $i"; sleep $((RANDOM % 8 + 3))
          done
          exit 1
